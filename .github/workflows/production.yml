name: Dummy CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

env:
  NODE_VERSION: "20"

jobs:
  code-quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run linter
        run: echo "Lint passed ✅"

      - name: Run formatter
        run: echo "Format check passed ✅"

      - name: Security scan
        run: echo "Security scan passed ✅"

  tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run unit tests
        run: echo "Unit tests passed ✅"

      - name: Run integration tests
        run: echo "Integration tests passed ✅"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: tests
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build app
        run: |
          echo "Building..."
          sleep 2
          echo "Build successful ✅"

  container-security:
    name: Container Security Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Scan container
        run: echo "No vulnerabilities found ✅"

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: container-security
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy
        run: |
          echo "Deploying to staging..."
          sleep 2
          echo "Staging deployed ✅"

      - name: Health check
        run: echo "Staging healthy ✅"

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy-staging

    steps:
      - name: Run smoke tests
        run: echo "Smoke tests passed ✅"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: smoke-tests
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy
        run: |
          echo "Deploying to production..."
          sleep 2
          echo "Production deployed ✅"

      - name: Health check
        run: echo "Production healthy ✅"

  post-deployment:
    name: Post Deployment Monitoring
    runs-on: ubuntu-latest
    needs: deploy-production
    if: always()

    steps:
      - name: Monitoring
        run: echo "Monitoring OK ✅"

      - name: Done
        run: echo "Pipeline completed 🎉"
