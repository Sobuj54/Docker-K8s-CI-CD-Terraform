apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: node-app
  template:
    metadata:
      labels:
        app: node-app
    spec:
      containers:
        - name: node-app
          image: embarkx/hello-node
          # env:
          #   - name: APP_MESSAGE
          #     value: "Hello from app.yaml"
          #   - name: DB_PASSWORD
          #     value: "dkshorMA="
          env:
            - name: APP_MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: node-config
                  key: APP_MESSAGE
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: node-secret
                  key: DB_PASSWORD
            - name: ENV_VALUE
              valueFrom:
                secretKeyRef:
                  name: node-secret
                  key: ENV_VALUE
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: node-app
spec:
  selector:
    app: node-app
  type: NodePort
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 31900
